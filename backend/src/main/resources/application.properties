spring.application.name=backend-api

#Puerto del servidor
server.port=8080

#Configuración de la base de datos
spring.datasource.url=jdbc:mysql://mysql-db:3306/erp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de JPA/Hibernate
# Creará las taablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update 
# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect